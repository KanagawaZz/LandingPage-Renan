<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="author" content="Dr. Renan Moraes, Advogado" />
    <!-- max-image-preview:large libera a prévia grande da imagem nos resultados e no Discover -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Title, description, Open Graph, Twitter e JSON-LD: gerados no build a partir de src/data/siteConfig.js -->
    <!--app-head-->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fontes do próprio site (src/styles/fonts.css): as três aparecem já na abertura -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/playfair-display-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/playfair-display-italic-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/plus-jakarta-sans-latin.woff2" crossorigin />
    <!-- Retrato do hero (LCP): mesmo recorte e tamanhos do <picture> em src/components/Hero.js -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" media="(width > 768px)"
      imagesrcset="/images/renan-retrato-recorte-560.webp 560w, /images/renan-retrato-recorte-840.webp 840w, /images/renan-retrato-recorte-1086.webp 1086w"
      imagesizes="(width > 900px) min(50vw, 720px), min(100vw, 640px)" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" media="(max-width: 768px)"
      imagesrcset="/images/renan-retrato-recorte-mobile-480.webp 480w, /images/renan-retrato-recorte-mobile-800.webp 800w"
      imagesizes="min(100vw, 640px)" />

    <!-- Estilos no <head> (e não importados pelo JS) para já valerem no primeiro quadro,
         sem o conteúdo aparecer e sumir antes das animações de entrada -->
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/brand.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="stylesheet" href="/src/styles/animations.css" />
  </head>
  <body>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div id="app"><!--app-html--></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
