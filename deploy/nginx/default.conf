# Servidor do site estático (imagem nginx-unprivileged: roda sem root, na porta 8080).
# O HTTPS e o certificado ficam com o Traefik do Dokploy, que repassa as visitas para cá.
# Este arquivo vai dentro da imagem (Dockerfile): o Dokploy apaga arquivos do repositório
# montados como volume a cada deploy.

# Compressão: os arquivos de texto já saem compactados do build (.gz ao lado do original,
# servidos por gzip_static). O gzip dinâmico cobre o que não tiver versão pronta.
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

server_tokens off;

# IP real do visitante nos logs (o Traefik fica na frente, numa rede interna do Docker)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Redirecionamentos relativos: sem "http://" nem a porta interna 8080 no Location
  absolute_redirect off;

  # www.dominio → dominio (vale quando o www também for cadastrado na aba Domains)
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  # Verificação de saúde do container (Dockerfile e Dokploy)
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Páginas: sempre revalidadas, para cada deploy aparecer na hora
  location / {
    try_files $uri $uri.html $uri/ =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # CSS, JS e fontes do build: nome com hash, então podem ficar em cache por 1 ano.
  # "^~" faz este bloco vencer a regra de imagens abaixo para tudo que estiver em /assets/.
  location ^~ /assets/ {
    access_log off;
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Imagens, vídeo e ícones (nomes fixos): 30 dias, revalidando em segundo plano
  location ~* \.(?:webp|avif|jpe?g|png|svg|ico|mp4|webm)$ {
    access_log off;
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
  }

  location = /robots.txt {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /sitemap.xml {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Endereço inexistente: mostra a página inicial, mas com status 404 (correto para o Google)
  error_page 404 /index.html;
}
