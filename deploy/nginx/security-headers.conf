# Cabeçalhos de segurança, incluídos em cada "location" do default.conf
# (no nginx, um add_header dentro de location anula os do nível de cima).

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HTTPS obrigatório por 1 ano no navegador (o Traefik do Dokploy serve o certificado).
# Sem includeSubDomains, para não afetar outros subdomínios que existam no domínio.
add_header Strict-Transport-Security "max-age=31536000" always;

# Origem permitida para cada tipo de recurso. Tudo do próprio site; os domínios do
# Google Analytics e do Microsoft Clarity só são usados depois do "Aceitar" no aviso
# de cookies (src/utils/consent.js). 'unsafe-inline' em style-src: o HTML usa
# atributos style com variáveis CSS (ex.: style="--step: 1").
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://*.clarity.ms; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.clarity.ms https://c.bing.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com https://*.clarity.ms https://c.bing.com; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
